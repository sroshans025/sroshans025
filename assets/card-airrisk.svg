<style>text{font-family:'Segoe UI', Helvetica, Arial, sans-serif}.dr{stroke-dasharray:100;animation:dr 3s ease-in-out infinite}@keyframes dr{0%{stroke-dashoffset:100}60%,100%{stroke-dashoffset:0}}
