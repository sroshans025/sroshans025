<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03060d"/><stop offset="1" stop-color="#0b1f4a"/></linearGradient>
<radialGradient id="mg"><stop offset="0" stop-color="#a5d6ff" stop-opacity=".5"/><stop offset="1" stop-color="#a5d6ff" stop-opacity="0"/></radialGradient>
<clipPath id="c"><rect width="900" height="200" rx="20"/></clipPath></defs>
<style>.bob{animation:bob .4s ease-in-out infinite alternate}.leg{transform-box:fill-box;transform-origin:50% 0%}
.l1,.l4{animation:sa .4s ease-in-out infinite alternate}.l2,.l3{animation:sb .4s ease-in-out infinite alternate}
.tail{transform-box:fill-box;transform-origin:100% 100%;animation:wag .25s ease-in-out infinite alternate}
.ear{transform-box:fill-box;transform-origin:50% 100%;animation:flap .4s ease-in-out infinite alternate}
.tongue{transform-box:fill-box;transform-origin:50% 0%;animation:pant .4s ease-in-out infinite alternate}
.dust{animation:dust .8s ease-out infinite}.d2{animation-delay:.3s}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes sa{from{transform:rotate(-35deg)}to{transform:rotate(35deg)}}@keyframes sb{from{transform:rotate(35deg)}to{transform:rotate(-35deg)}}
@keyframes wag{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}@keyframes flap{from{transform:rotate(6deg)}to{transform:rotate(-10deg)}}
@keyframes pant{from{transform:scaleY(.7)}to{transform:scaleY(1.2)}}
@keyframes dust{0%{opacity:.6;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(-30px,-12px) scale(1.4)}} .st{animation:tw 3s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
.run{animation:run 8s linear infinite}@keyframes run{from{transform:translateX(-140px)}to{transform:translateX(1020px)}}
.h1{animation:pan 22s linear infinite}.h2{animation:pan 11s linear infinite}@keyframes pan{from{transform:translateX(0)}to{transform:translateX(-900px)}}
.fr{transform-box:fill-box;transform-origin:center;animation:fl .8s ease-in-out infinite alternate}@keyframes fl{from{transform:translateY(0) rotate(-10deg)}to{transform:translateY(-14px) rotate(10deg)}}
.sh{animation:ss 4s linear infinite}@keyframes ss{0%{transform:translate(950px,10px);opacity:0}3%{opacity:1}12%{transform:translate(650px,90px);opacity:0}100%{transform:translate(650px,90px);opacity:0}}
</style>
