<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%" height="150">
  <style>
    .run { animation: run 9s linear infinite; }
    .bob { animation: bob .4s ease-in-out infinite alternate; }
    .leg { transform-box: fill-box; transform-origin: 50% 0%; }
    .l1, .l4 { animation: swingA .4s ease-in-out infinite alternate; }
    .l2, .l3 { animation: swingB .4s ease-in-out infinite alternate; }
    .tail { transform-box: fill-box; transform-origin: 100% 100%; animation: wag .25s ease-in-out infinite alternate; }
    .ear { transform-box: fill-box; transform-origin: 50% 0%; animation: flap .4s ease-in-out infinite alternate; }
    .tongue { transform-box: fill-box; transform-origin: 50% 0%; animation: pant .4s ease-in-out infinite alternate; }
    .dust { animation: dust .8s ease-out infinite; opacity: 0; }
    .d2 { animation-delay: .3s; }
    .cloud { animation: drift 30s linear infinite; }
    @keyframes run { from { transform: translateX(-120px); } to { transform: translateX(860px); } }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-5px); } }
    @keyframes swingA { from { transform: rotate(-35deg); } to { transform: rotate(35deg); } }
    @keyframes swingB { from { transform: rotate(35deg); } to { transform: rotate(-35deg); } }
    @keyframes wag { from { transform: rotate(-25deg); } to { transform: rotate(25deg); } }
    @keyframes flap { from { transform: rotate(8deg); } to { transform: rotate(-14deg); } }
    @keyframes pant { from { transform: scaleY(.7); } to { transform: scaleY(1.2); } }
    @keyframes dust { 0% { opacity: .6; transform: translate(0,0) scale(.5); } 100% { opacity: 0; transform: translate(-30px,-12px) scale(1.4); } }
    @keyframes drift { from { transform: translateX(-100px); } to { transform: translateX(900px); } }
  </style>
  <g class="cloud" opacity=".35"><ellipse cx="0" cy="30" rx="34" ry="10" fill="#8aa4c8"/><ellipse cx="20" cy="24" rx="22" ry="9" fill="#8aa4c8"/></g>
  <line x1="0" y1="128" x2="800" y2="128" stroke="#8b949e" stroke-width="2" stroke-dasharray="10 8" opacity=".6"/>
  <g class="run">
    <g transform="translate(0,128)">
      <g class="dust"><circle cx="-38" cy="-4" r="5" fill="#b9a48a"/></g>
      <g class="dust d2"><circle cx="-46" cy="-2" r="4" fill="#b9a48a"/></g>
      <g class="bob">
        <!-- tail: black, bushy, white tip -->
        <g class="tail leg">
          <path d="M-30 -30 Q-56 -38 -52 -60" stroke="#262a31" stroke-width="9" fill="none" stroke-linecap="round"/>
          <path d="M-52 -52 Q-53 -58 -52 -60" stroke="#f5f5f5" stroke-width="9" fill="none" stroke-linecap="round"/>
        </g>
        <!-- back legs -->
        <g class="leg l3"><rect x="-26" y="-22" width="9" height="22" rx="4" fill="#262a31" stroke="#5b616b" stroke-width=".8"/><rect x="-26" y="-7" width="9" height="7" rx="3.5" fill="#f5f5f5"/></g>
        <g class="leg l1"><rect x="-12" y="-22" width="9" height="22" rx="4" fill="#262a31" stroke="#5b616b" stroke-width=".8"/><rect x="-12" y="-7" width="9" height="7" rx="3.5" fill="#f5f5f5"/></g>
        <!-- body -->
        <rect x="-32" y="-46" width="68" height="30" rx="15" fill="#262a31" stroke="#5b616b" stroke-width=".8"/>
        <rect x="-18" y="-22" width="48" height="8" rx="4" fill="#f5f5f5" opacity=".9"/>
        <!-- white chest ruff -->
        <path d="M24 -44 Q40 -40 38 -20 Q28 -16 22 -24z" fill="#f5f5f5"/>
        <!-- front legs -->
        <g class="leg l2"><rect x="14" y="-22" width="9" height="22" rx="4" fill="#262a31" stroke="#5b616b" stroke-width=".8"/><rect x="14" y="-7" width="9" height="7" rx="3.5" fill="#f5f5f5"/></g>
        <g class="leg l4"><rect x="25" y="-22" width="9" height="22" rx="4" fill="#262a31" stroke="#5b616b" stroke-width=".8"/><rect x="25" y="-7" width="9" height="7" rx="3.5" fill="#f5f5f5"/></g>
        <!-- collar -->
        <rect x="30" y="-54" width="10" height="9" rx="4" fill="#2f81f7"/>
        <circle cx="35" cy="-43" r="3" fill="#f2cc60"/>
        <!-- head: black with white blaze + muzzle -->
        <circle cx="46" cy="-58" r="16" fill="#262a31" stroke="#5b616b" stroke-width=".8"/>
        <path d="M50 -73 Q56 -62 62 -52 L52 -50 Q47 -60 46 -73z" fill="#f5f5f5"/>
        <ellipse cx="60" cy="-52" rx="11" ry="8" fill="#f5f5f5"/>
        <circle cx="68" cy="-55" r="3.4" fill="#111"/>
        <circle cx="49" cy="-62" r="2.8" fill="#111"/>
        <circle cx="50" cy="-63" r="1" fill="#fff"/>
        <path class="tongue" d="M62 -46 q3 9 6 0z" fill="#ff6f91"/>
        <!-- semi-erect ear with folded tip -->
        <g class="ear"><path d="M37 -70 L34 -86 Q44 -84 46 -72z" fill="#262a31" stroke="#5b616b" stroke-width=".8"/><path d="M34 -86 Q40 -86 41 -81 Q37 -80 34 -86z" fill="#1a1d22"/></g>
      </g>
    </g>
  </g>
</svg>
