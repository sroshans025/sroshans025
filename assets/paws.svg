<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40" width="100%" height="40">
  <style>
    .p { opacity: 0; animation: step 4s infinite; }
    @keyframes step { 0%,5% { opacity: 0; } 15%,60% { opacity: .85; } 80%,100% { opacity: 0; } }
  </style>
  <defs>
    <g id="paw" fill="#c98b4a">
      <ellipse cx="0" cy="4" rx="7" ry="6"/>
      <ellipse cx="-8" cy="-4" rx="3" ry="4"/><ellipse cx="-3" cy="-8" rx="3" ry="4"/>
      <ellipse cx="3" cy="-8" rx="3" ry="4"/><ellipse cx="8" cy="-4" rx="3" ry="4"/>
    </g>
  </defs>
  <g transform="translate(0,20)">
    <use href="#paw" x="80"  y="6"  class="p" style="animation-delay:0s"/>
    <use href="#paw" x="180" y="-6" class="p" style="animation-delay:.3s"/>
    <use href="#paw" x="280" y="6"  class="p" style="animation-delay:.6s"/>
    <use href="#paw" x="380" y="-6" class="p" style="animation-delay:.9s"/>
    <use href="#paw" x="480" y="6"  class="p" style="animation-delay:1.2s"/>
    <use href="#paw" x="580" y="-6" class="p" style="animation-delay:1.5s"/>
    <use href="#paw" x="680" y="6"  class="p" style="animation-delay:1.8s"/>
  </g>
</svg>
