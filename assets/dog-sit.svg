<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="280">
<defs><radialGradient id="rg"><stop offset="0" stop-color="#1f6feb" stop-opacity=".55"/><stop offset="1" stop-color="#1f6feb" stop-opacity="0"/></radialGradient></defs>
<style>.eye{transform-box:fill-box;transform-origin:50% 50%;animation:blink 4s infinite}@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.tg{transform-box:fill-box;transform-origin:50% 0%;animation:pt .5s ease-in-out infinite alternate}@keyframes pt{from{transform:scaleY(.8)}to{transform:scaleY(1.15)}}
.tl{transform-box:fill-box;transform-origin:0% 100%;animation:wg .35s ease-in-out infinite alternate}@keyframes wg{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
.hd{transform-origin:150px 140px;animation:tilt 3s ease-in-out infinite alternate}@keyframes tilt{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
.ht{animation:up 3.6s ease-in infinite}@keyframes up{0%{opacity:0;transform:translate(0,30px) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translate(8px,-40px) scale(1.1)}}
.bub{transform-box:fill-box;transform-origin:20% 100%;animation:bp 1.6s ease-in-out infinite}@keyframes bp{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.gl{animation:gp 3s ease-in-out infinite;transform-origin:150px 130px}@keyframes gp{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(1.1);opacity:1}}
</style>
<circle class="gl" cx="150" cy="130" r="120" fill="url(#rg)"/>
